[package]
name = "homeofficetracker"
version = "0.1.0"
description = "Privacy-friendly working time tracker for home office"
authors = ["Losenicky Design"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "homeofficetracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2.4.0"
tauri-plugin-single-instance = "2.4.5"
chrono = "0.4.45"
rust_xlsxwriter = "0.99.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-opener = "2.5.5"
sys-locale = "0.3.2"
uuid = { version = "1.26.1", features = ["v4"] }
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", features = ["NSString"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }

[features]
# Verze pro Mac App Store: bez vlastního aktualizátoru (pravidla App Store),
# aktualizace řeší obchod.
app-store = []
