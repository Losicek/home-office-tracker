# Builds installers for macOS (universal .dmg, signed + notarized) and Windows
# (.msi + .exe), plus signed update bundles and latest.json for the in-app
# updater.
# - Push a tag `vX.Y.Z` → everything is attached to a *draft* GitHub release.
#   Publishing the release makes the update visible to installed apps.
# - Run manually from the Actions tab → installers are available as artifacts.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) for updates; for macOS signing
# APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID,
# APPLE_PROVISIONING_PROFILE (base64 Developer ID profile with iCloud).
# Without the Apple secrets the macOS build is simply unsigned.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --config src-tauri/tauri.icloud.conf.json
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target.nosync
      - run: npm ci
      - run: cargo test
        working-directory: src-tauri
      # Profil Developer ID s iCloudem (pro synchronizaci mezi Macy).
      - name: Provisioning profile
        if: matrix.os == 'macos-latest'
        env:
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          mkdir -p src-tauri/profiles
          echo "$PROFILE" | base64 --decode > src-tauri/profiles/developer-id.provisionprofile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Home Office Tracker ${{ github.ref_name }}
          releaseBody: See the assets below to download and install.
          releaseDraft: true
      # tauri-action notarizuje jen .app; notarizujeme i .dmg, aby macOS
      # neupozorňoval ani při otevření obrazu disku.
      - name: Notarize DMG + stable download names (macOS)
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(ls src-tauri/target.nosync/universal-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          # GitHub nahrazuje mezery v názvu tečkami — stejné jméno = přepsání.
          NAME=$(basename "$DMG" | tr ' ' '.')
          cp "$DMG" "$RUNNER_TEMP/$NAME"
          cp "$DMG" "$RUNNER_TEMP/HomeOfficeTracker-mac.dmg"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$NAME" \
            "$RUNNER_TEMP/HomeOfficeTracker-mac.dmg" --clobber
      # Trvalé odkazy: …/releases/latest/download/HomeOfficeTracker-windows-setup.exe
      - name: Stable download names (Windows)
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXE=$(ls src-tauri/target.nosync/release/bundle/nsis/*.exe)
          MSI=$(ls src-tauri/target.nosync/release/bundle/msi/*.msi)
          cp "$EXE" HomeOfficeTracker-windows-setup.exe
          cp "$MSI" HomeOfficeTracker-windows.msi
          gh release upload "$GITHUB_REF_NAME" HomeOfficeTracker-windows-setup.exe \
            HomeOfficeTracker-windows.msi --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            src-tauri/target.nosync/**/bundle/dmg/*.dmg
            src-tauri/target.nosync/**/bundle/msi/*.msi
            src-tauri/target.nosync/**/bundle/nsis/*.exe
