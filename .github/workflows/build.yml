# Builds installers for macOS (universal .dmg) and Windows (.msi + .exe).
# - Push a tag `vX.Y.Z` → installers are attached to a *draft* GitHub release.
# - Run manually from the Actions tab → installers are available as artifacts.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target.nosync
      - run: npm ci
      - run: cargo test
        working-directory: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Home Office Tracker ${{ github.ref_name }}
          releaseBody: See the assets below to download and install.
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            src-tauri/target.nosync/**/bundle/dmg/*.dmg
            src-tauri/target.nosync/**/bundle/msi/*.msi
            src-tauri/target.nosync/**/bundle/nsis/*.exe
